name: Validate template

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Install FFmpeg for the media smoke test
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Validate project structure and schemas
        run: python scripts/validate_project.py .
      - name: Compile Python scripts
        run: python -m compileall -q scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: for script in scripts/*.sh tests/*.sh; do bash -n "$script"; done
      - name: Smoke-test the media pipeline
        run: bash tests/smoke_media_pipeline.sh
